version: 2

updates:
  # The web admin venv. requirements.txt pins transitives as well as direct
  # dependencies, so Werkzeug and Jinja2 get their own PRs rather than being
  # invisible until a Flask release happens to pull them along.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Routine version bumps arrive as one PR; security updates are ungrouped
      # by default and still come through individually and immediately.
      pallets:
        patterns:
          - "flask"
          - "werkzeug"
          - "jinja2"
          - "markupsafe"
          - "itsdangerous"
          - "click"
          - "blinker"

  # No workflows in the repo yet — this is here so any that get added are
  # covered from the first commit rather than whenever someone remembers.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
