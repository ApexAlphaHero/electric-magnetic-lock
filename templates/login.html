{% extends "base.html" %}
{% block title %}Sign in — Door Access{% endblock %}

{% block content %}
<div class="card login">
  <h1>Door Access</h1>
  <p class="muted">Sign in with your Raspberry Pi account.</p>

  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit" class="primary">Sign in</button>
  </form>

  <p class="muted small">Requires membership in the <code>dooradmin</code> group.</p>
</div>
{% endblock %}
